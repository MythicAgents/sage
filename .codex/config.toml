[features]
hooks = true

[features.multi_agent_v2]
enabled = true
hide_spawn_agent_metadata = false
tool_namespace = "agents"
max_concurrent_threads_per_session = 4

[agents]
max_depth = 2

[[hooks.PreToolUse]]
matcher = "^(apply_patch|Edit|Write|Bash)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/skills/sage-architecture-governor/scripts/pre_tool_use_arch_gate.py"'
timeout = 10
statusMessage = "Checking Sage architecture gate"

[[hooks.Stop]]
matcher = ".*"

[[hooks.Stop.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/skills/sage-architecture-governor/scripts/check_arch_budget.py" --quiet --changed --warn-only'
timeout = 20
statusMessage = "Checking Sage architecture budget"

[[hooks.Stop.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/skills/sage-artifact-retention/scripts/retention_guard.py"'
timeout = 20
statusMessage = "Checking Sage artifact retention"

[[hooks.SubagentStop]]
matcher = ".*"

[[hooks.SubagentStop.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/skills/sage-artifact-retention/scripts/retention_guard.py"'
timeout = 20
statusMessage = "Checking Sage sub-agent artifact retention"

[agents.sage_cyber_executor]
description = "Cybersecurity-specific Sage implementation and explicitly authorized live-range execution."
config_file = "./agents/sage_cyber_executor.toml"
nickname_candidates = ["Sentinel", "Vanguard", "Warden"]

[agents.sage_eval_reviewer]
description = "Fresh-context, read-only adversarial reviewer for Sage evaluation, conversation behavior, runtime authority, sealed candidates, provenance, and lifecycle gates."
config_file = "./agents/sage_eval_reviewer.toml"
nickname_candidates = ["Auditor", "Skeptic", "Verifier"]

[tui]
notifications = ["agent-turn-complete", "approval-requested"]
notification_condition = "unfocused"
notification_method = "auto"
terminal_title = ["spinner", "project", "thread"]
