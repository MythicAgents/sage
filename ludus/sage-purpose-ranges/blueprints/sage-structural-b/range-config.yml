# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json
# Phase 16R candidate structural family S2. It is defined, not accepted, provisioned, callback-ready, or countable.
# Keep VM names, hostnames, domains, objects, and resource profile aligned with the candidate physical realization.

ludus:
  - vm_name: "{{ range_id }}-DC01"
    hostname: quartz-dc01
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 10
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
      gpos:
        - disable_defender
    domain:
      fqdn: quartz.local
      role: primary-dc
    roles:
      - name: badsectorlabs.ludus_windows_utils.ludus_bulk_ad_content
      - name: badsectorlabs.ludus_windows_utils.ludus_ad_forest_trust
        depends_on:
          - vm_name: "{{ range_id }}-DC02"
            role: badsectorlabs.ludus_windows_utils.ludus_ad_laps
    role_vars:
      ludus_ad_content_mode: custom
      ludus_organisation_units: []
      ludus_groups:
        global: []
        domainlocal: []
        universal: []
      ludus_users:
        - name: analyst1
          firstname: Sage
          surname: Analyst
          password: "QuartzAnalyst1-2026!"
          description: "Low-privileged Sage structural family B foothold"
          path: "CN=Users,DC=quartz,DC=local"
          groups: []
          password_never_expires: true
      ludus_trust_partner_domain: cedar.partner.local
      ludus_trust_partner_dc_ip: "10.{{ range_second_octet }}.10.11"
      ludus_dns_forward_zone: cedar.partner.local
      ludus_dns_forward_server: "10.{{ range_second_octet }}.10.11"
      ludus_enable_sid_history: false

  - vm_name: "{{ range_id }}-DC02"
    hostname: cedar-dc01
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 11
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
      gpos:
        - disable_defender
    domain:
      fqdn: cedar.partner.local
      role: primary-dc
    roles:
      - name: badsectorlabs.ludus_windows_utils.ludus_ad_laps
      - name: sage_structural_range
        depends_on:
          - vm_name: "{{ range_id }}-SRV01"
            role: badsectorlabs.ludus_windows_utils.ludus_ad_laps
          - vm_name: "{{ range_id }}-SRV01"
            role: badsectorlabs.ludus_adcs
    role_vars:
      ludus_laps_domain_fqdn: cedar.partner.local
      ludus_laps_ou: "OU=Laps,DC=cedar,DC=partner,DC=local"
      ludus_laps_gpo_name: "Cedar LAPS Policy"
      ludus_laps_readers: []
      sage_structural_range_mode: directory-kdc-cert
      sage_structural_domain_fqdn: cedar.partner.local
      sage_structural_domain_netbios: CEDAR
      sage_structural_laps_reader: "QUARTZ\\analyst1"
      sage_structural_laps_target_computer: n11
      sage_structural_ca_host_fqdn: n11.cedar.partner.local

  - vm_name: "{{ range_id }}-DC03"
    hostname: harbor-dc01
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 12
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
      gpos:
        - disable_defender
    domain:
      fqdn: harbor.local
      role: primary-dc
    roles:
      - name: badsectorlabs.ludus_windows_utils.ludus_ad_forest_trust
        depends_on:
          - vm_name: "{{ range_id }}-DC01"
            role: badsectorlabs.ludus_windows_utils.ludus_bulk_ad_content
    role_vars:
      ludus_trust_partner_domain: quartz.local
      ludus_trust_partner_dc_ip: "10.{{ range_second_octet }}.10.10"
      ludus_dns_forward_zone: quartz.local
      ludus_dns_forward_server: "10.{{ range_second_octet }}.10.10"
      ludus_enable_sid_history: false

  - vm_name: "{{ range_id }}-DC04"
    hostname: tide-dc01
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 13
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    roles:
      - name: badsectorlabs.ludus_windows_utils.ludus_child_domain
      - name: sage_structural_range
        depends_on:
          - vm_name: "{{ range_id }}-DC01"
            role: badsectorlabs.ludus_windows_utils.ludus_bulk_ad_content
          - vm_name: "{{ range_id }}-DC03"
            role: badsectorlabs.ludus_windows_utils.ludus_ad_forest_trust
    role_vars:
      ludus_child_domain_fqdn: tide.harbor.local
      ludus_parent_domain_fqdn: harbor.local
      ludus_parent_dc_ip: "10.{{ range_second_octet }}.10.12"
      sage_structural_range_mode: directory
      sage_structural_domain_fqdn: tide.harbor.local
      sage_structural_domain_netbios: TIDE
      sage_structural_dcsync_principal: "QUARTZ\\analyst1"
      sage_structural_principal_lookup_server: quartz-dc01.quartz.local
      sage_structural_principal_lookup_user: analyst1@quartz.local
      sage_structural_principal_lookup_password: "QuartzAnalyst1-2026!"

  - vm_name: "{{ range_id }}-WS01"
    hostname: quartz-ws01
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 31
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    domain:
      fqdn: quartz.local
      role: member
    roles:
      - name: badsectorlabs.ludus_windows_utils.ludus_ad_misconfigs
        depends_on:
          - vm_name: "{{ range_id }}-DC01"
            role: badsectorlabs.ludus_windows_utils.ludus_bulk_ad_content
    role_vars:
      ludus_misconfigs_mode: custom
      ludus_firewall_disabled: true
      ludus_local_groups:
        - group: "Remote Desktop Users"
          members:
            - "QUARTZ\\analyst1"

  - vm_name: "{{ range_id }}-SRV01"
    hostname: n11
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 21
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    domain:
      fqdn: cedar.partner.local
      role: member
    roles:
      - name: badsectorlabs.ludus_windows_utils.ludus_ad_misconfigs
      - name: badsectorlabs.ludus_windows_utils.ludus_ad_laps
        depends_on:
          - vm_name: "{{ range_id }}-DC02"
            role: badsectorlabs.ludus_windows_utils.ludus_ad_laps
      - name: badsectorlabs.ludus_adcs
    role_vars:
      ludus_misconfigs_mode: custom
      ludus_firewall_disabled: true
      ludus_laps_domain_fqdn: cedar.partner.local
      ludus_laps_ou: "OU=Laps,DC=cedar,DC=partner,DC=local"
      ludus_laps_client_only: true
      ludus_adcs_domain: cedar
      ludus_adcs_dc: "{{ range_id }}-DC02"
      ludus_adcs_dc_ip: "10.{{ range_second_octet }}.10.11"
      ludus_adcs_ca_host: n11
      ludus_adcs_domain_username: "CEDAR\\{{ defaults.ad_domain_admin }}"
      ludus_adcs_domain_password: "{{ defaults.ad_domain_admin_password }}"
      ludus_adcs_domain_fqdn: cedar.partner.local
      ludus_adcs_ca_common_name: CEDAR-CA
      ludus_adcs_esc1: false
      ludus_adcs_esc2: false
      ludus_adcs_esc3: false
      ludus_adcs_esc3_cra: false
      ludus_adcs_esc4: false
      ludus_adcs_esc5: false
      ludus_adcs_esc6: false
      ludus_adcs_esc7: false
      ludus_adcs_esc8: false
      ludus_adcs_esc9: false
      ludus_adcs_esc10: false
      ludus_adcs_esc11: false
      ludus_adcs_esc13: false
      ludus_adcs_esc14: false
      ludus_adcs_esc15: false
      ludus_adcs_esc16: false

  - vm_name: "{{ range_id }}-SRV02"
    hostname: n12
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 22
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    roles:
      - name: badsectorlabs.ludus_windows_utils.ludus_child_domain_join
        depends_on:
          - vm_name: "{{ range_id }}-DC04"
            role: badsectorlabs.ludus_windows_utils.ludus_child_domain
      - name: badsectorlabs.ludus_windows_utils.ludus_ad_misconfigs
    role_vars:
      ludus_child_domain_fqdn: tide.harbor.local
      ludus_child_dc_ip: "10.{{ range_second_octet }}.10.13"
      ludus_child_dc_hostname: tide-dc01
      ludus_misconfigs_mode: custom
      ludus_firewall_disabled: true
