name: Container image

# Build the Sage Mythic payload image, and publish it to GHCR FROM main ONLY.
#
# Follows the MythicAgents convention (see Ne0nd0g/merlin-mythic docker.yml): publish to GHCR with
# the built-in GITHUB_TOKEN — no external registry secret to leak — and build-only (no push) on
# pull requests so a PR still validates the Dockerfile. A push to main publishes :latest and a sha-
# tag. A v* release tag publishes its version (v0.2.0 -> :0.2.0 and :0.2; a pre-release such as
# v0.2.0-rc.1 gets only :0.2.0-rc.1), but only when the tagged commit is already on main and the tag
# matches agent_capabilities.json, so a release image is never built from unmerged code or mislabeled.
# Push main before pushing the tag.
#
# mythic-cli install pulls the image named in config.json's remote_images.sage. Cutting a release
# moves it to the new version together with agent_version; the version check enforces that.

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  image:
    name: Build and publish (GHCR, main and release tags)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so a release tag can be checked against main below.
          fetch-depth: 0

      # Publish on a push to main, or on a release tag whose commit is on main and whose version
      # matches agent_capabilities.json. Everything else (dev, PRs, dispatch) builds without pushing.
      - name: Decide whether to publish
        id: gate
        run: |
          declared="$(jq -r '.agent_version' agent_capabilities.json)"
          echo "agent_version=$declared" >> "$GITHUB_OUTPUT"
          publish=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            case "$GITHUB_REF" in
              refs/heads/main) publish=true ;;
              refs/tags/v*)
                if [ "${GITHUB_REF_NAME#v}" != "$declared" ]; then
                  echo "::error::Release tag '$GITHUB_REF_NAME' != agent_capabilities.json agent_version '$declared'."
                  exit 1
                fi
                if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                  echo "::error::Release tag '$GITHUB_REF_NAME' is not on main. Merge to main and push it before tagging."
                  exit 1
                fi
                publish=true ;;
            esac
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      # Credentials are only needed when we actually push. Other builds validate only.
      - name: Log in to GHCR
        if: steps.gate.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 is built via emulation, so QEMU must be registered before buildx.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # github.repository is lowercased by the action -> ghcr.io/mythicagents/sage
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=${{ github.repository }} container for use with Mythic
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build and (main or release tag only) push the Sage image
        uses: docker/build-push-action@v6
        with:
          context: Payload_Type/sage
          file: Payload_Type/sage/Dockerfile
          # Bake the exact commit and release version into the image so `main.py`'s startup banner and
          # `docker inspect` report the build provenance (see Payload_Type/sage/_version.py).
          build-args: |
            SAGE_GIT_COMMIT=${{ github.sha }}
            SAGE_AGENT_VERSION=${{ steps.gate.outputs.agent_version }}
          # Both archs per project policy. arm64 builds under QEMU emulation (the image git-fetches
          # the BloodHound MCP and runs `uv sync`), so expect this job to be slow; the gha cache below
          # keeps repeat builds reasonable.
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.gate.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
