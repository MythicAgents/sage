name: Container image

# Build the Sage Mythic payload image, and publish it to GHCR FROM main ONLY.
#
# Follows the MythicAgents convention (see Ne0nd0g/merlin-mythic docker.yml): publish to GHCR with
# the built-in GITHUB_TOKEN — no external registry secret to leak — and build-only (no push) on
# pull requests so a PR still validates the Dockerfile.
#
# A push to main builds once and publishes :latest, a sha- tag, and the version declared in
# agent_capabilities.json (for example :0.3.0), so the exact release image exists, and can be
# qualified, before the release tag. Once v<version> is tagged, later main pushes leave that version
# reference on its released image until agent_version is bumped.
#
# A v* release tag never rebuilds or overwrites anything. It verifies the already-published image:
# the tag matches agent_version, the tagged commit is on main, and the annotated tag message carries
# `Image-Digest: sha256:<qualified manifest digest>`, which must be exactly what :<version> resolves
# to, with both architectures and OCI revision/version labels matching the tag. Only then does a
# final release (not a pre-release) point its minor alias (:0.3) at that same manifest.
# The decisions live in .github/scripts/release_image.py and are tested offline.
#
# mythic-cli install pulls the image named in config.json's remote_images.sage. Cutting a release
# moves it to the new version together with agent_version; the version check enforces that.

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  image:
    name: Build and publish (GHCR, main only)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags, so main can see whether its declared version is already released.
          fetch-depth: 0

      # Publish on a push to main only. Everything else (dev, PRs, dispatch) builds without pushing.
      - name: Decide whether to publish
        id: gate
        run: |
          declared="$(jq -r '.agent_version' agent_capabilities.json)"
          echo "agent_version=$declared" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/release_image.py select --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" \
            --sha "$GITHUB_SHA" --declared "$declared" --image "$REGISTRY/${GITHUB_REPOSITORY,,}"

      # Credentials are only needed when we actually push. Other builds validate only.
      - name: Log in to GHCR
        if: steps.gate.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 is built via emulation, so QEMU must be registered before buildx.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # github.repository is lowercased by the action -> ghcr.io/mythicagents/sage
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: latest=false
          # References come from the gate above; this step supplies the OCI labels. The version label is
          # the declared release version, which the release tag later checks.
          tags: type=sha,format=short
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=${{ github.repository }} container for use with Mythic
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.version=${{ steps.gate.outputs.agent_version }}

      - name: Build and (main only) push the Sage image
        uses: docker/build-push-action@v6
        with:
          context: Payload_Type/sage
          file: Payload_Type/sage/Dockerfile
          # Bake the exact commit and release version into the image so `main.py`'s startup banner and
          # `docker inspect` report the build provenance (see Payload_Type/sage/_version.py).
          build-args: |
            SAGE_GIT_COMMIT=${{ github.sha }}
            SAGE_AGENT_VERSION=${{ steps.gate.outputs.agent_version }}
          # Both archs per project policy. arm64 builds under QEMU emulation (the image git-fetches
          # the BloodHound MCP and runs `uv sync`), so expect this job to be slow; the gha cache below
          # keeps repeat builds reasonable.
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.gate.outputs.publish == 'true' }}
          tags: ${{ steps.gate.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-release:
    name: Verify the published release image (no rebuild)
    # Only the tag push itself; a manual run on a tag ref verifies nothing and moves no reference.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # only for pointing the minor alias at the verified manifest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Make sure the annotated tag object, and so its Image-Digest line, is present locally.
      - name: Fetch the annotated release tag
        run: git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify the version image against the tag
        id: verify
        run: |
          declared="$(jq -r '.agent_version' agent_capabilities.json)"
          python3 .github/scripts/release_image.py verify --tag "$GITHUB_REF_NAME" --declared "$declared" \
            --image "$REGISTRY/${GITHUB_REPOSITORY,,}"

      # Copies the verified manifest under the minor alias; nothing is rebuilt. Fails unless the alias
      # then resolves to exactly the qualified digest.
      - name: Point the minor alias at the verified manifest
        if: steps.verify.outputs.minor_alias != ''
        env:
          ALIAS: ${{ steps.verify.outputs.minor_alias }}
          DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$ALIAS" "${ALIAS%:*}@$DIGEST"
          resolved="$(python3 .github/scripts/release_image.py inspect "$ALIAS" | jq -r '.digest')"
          if [ "$resolved" != "$DIGEST" ]; then
            echo "::error::$ALIAS resolves to $resolved, not $DIGEST."
            exit 1
          fi
