# Repo-level lint/format config. Tooling-only: it ships in the public repo but is never imported by
# the runtime. The CI `lint` job is advisory (continue-on-error) until the existing baseline is
# addressed, so this starts with a conservative rule set rather than the full default.
#
# target-version is py313 — the lowest version whose syntax ruff assumes. The code runs on 3.14,
# which is a strict superset, so nothing is lost; pinning to a version ruff definitely knows avoids
# a hard error from the advisory job.
target-version = "py313"
line-length = 100

extend-exclude = [
    ".venv",
    ".venv.py313-orphaned",
    "Plans",
    ".sage_history",
    ".hillclimb",
    "**/goldens",
    "**/data",
]

[lint]
# Start narrow: pyflakes (F), a safe slice of pycodestyle (E), import sorting (I), and PEP 257
# docstrings (D) in Google style. Expand once the baseline is clean.
select = ["E", "F", "I", "D"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "D105",  # magic methods document themselves through the protocol they implement
    "D107",  # __init__ parameters are documented on the class
]

[lint.pydocstyle]
convention = "google"

# Docstrings are enforced on the shipped runtime first. Tests, development evaluation, and operator
# scripts are exempt until the runtime baseline is clean.
[lint.per-file-ignores]
"**/tests/**" = ["D"]
"**/test_*.py" = ["D"]
"Payload_Type/sage/ai/hillclimb/**" = ["D"]
"Payload_Type/sage/ai/trajectory/**" = ["D"]
"Payload_Type/sage/evals/**" = ["D"]
"skills/**" = ["D"]
